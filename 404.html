<title>新聞管理ツールは移転しました</title>
<script>
// 旧アドレス(neltecsystem-tech.github.io/shift-manager/…)から新しいアドレスへ。パス・?dg= などの続きもそのまま渡す
(function () {
  var p = location.pathname.replace(/^\/shift-manager\/?/, '').replace(/\.html$/, '').replace(/^index$/, '');
  location.replace('https://shift.workchat.neltec-tokyo.info/' + p + location.search + location.hash);
})();
</script>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;line-height:1.7}</style>
</head>

<p>自動で移動しない場合は上のリンクを押してください。ブックマークも新しいアドレスに替えてください。<br>
新しいアドレスでは、もう一度ログインが必要です。</p>
</body>
