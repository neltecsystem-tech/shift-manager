<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新聞シフト管理ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="data.js"></script>
<style>
:root { --primary:#1a56db; --primary-light:#e8eefb; --bg:#f5f6fa; --card:#fff; --border:#dde1e8; --text:#1e293b; --text-sub:#64748b; --danger:#dc2626; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Meiryo',sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
.nav { background:var(--primary); color:#fff; padding:0 20px; display:flex; align-items:center; height:52px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.nav h1 { font-size:16px; font-weight:600; margin-right:32px; white-space:nowrap; }
.nav-links { display:flex; gap:4px; overflow-x:auto; }
.nav-links button { background:none; border:none; color:rgba(255,255,255,.75); padding:8px 16px; cursor:pointer; font-size:13px; border-radius:6px 6px 0 0; transition:.15s; white-space:nowrap; }
.nav-links button:hover { background:rgba(255,255,255,.15); color:#fff; }
.nav-links button.active { background:var(--bg); color:var(--primary); font-weight:600; }
.container { max-width:1400px; margin:0 auto; padding:16px; }
.card { background:var(--card); border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); padding:20px; margin-bottom:16px; }
.card h2 { font-size:16px; margin-bottom:12px; color:var(--primary); border-bottom:2px solid var(--primary-light); padding-bottom:8px; }
.hidden { display:none !important; }
.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end; }
.filters label { font-size:12px; color:var(--text-sub); display:block; margin-bottom:2px; }
.filters select, .filters input[type=text] { padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-johoku { background:#dbeafe; color:#1d4ed8; }
.badge-kawagoe { background:#dcfce7; color:#166534; }
.badge-tachikawa { background:#fef3c7; color:#92400e; }
.badge-kawasaki { background:#fce7f3; color:#9d174d; }
.table-wrap { overflow-x:auto; max-height:72vh; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { background:#f1f5f9; color:var(--text-sub); font-weight:600; padding:8px 10px; position:sticky; top:0; z-index:2; border-bottom:2px solid var(--border); text-align:left; white-space:nowrap; }
tbody td { padding:6px 10px; border-bottom:1px solid #f1f5f9; white-space:nowrap; }
tbody tr:hover { background:var(--primary-light); }
.shift-table { border:1px solid #ccc; }
.shift-table th,.shift-table td { padding:5px 8px; font-size:13px; text-align:center; min-width:60px; border-bottom:1px solid #e2e8f0; }
.shift-table td.cn { text-align:left; font-weight:600; position:sticky; left:0; background:var(--card); z-index:1; min-width:100px; border-right:2px solid #94a3b8; }
.shift-table thead th { position:sticky; z-index:2; border-bottom:2px solid #94a3b8; background:#f1f5f9; }
.shift-table thead tr:first-child th { top:0; }
.shift-table thead tr:nth-child(2) th { top:28px; }
.shift-table thead th:first-child { position:sticky; left:0; z-index:4; background:#f1f5f9; border-right:2px solid #94a3b8; }
.shift-table tbody tr:nth-child(even) { background:#f8fafc; }
.shift-table tbody tr:hover { background:#e0e7ff !important; }
.shift-table td.am { background:#f0f9ff; border-left:2px solid #94a3b8; color:#1e293b; }
.shift-table td.pm { background:#fdf4ff; border-right:1px solid #e2e8f0; color:#1e293b; }
.shift-table tbody tr:nth-child(even) td.am { background:#e8f4fd; }
.shift-table tbody tr:nth-child(even) td.pm { background:#f5eafa; }
.shift-table td.cn { font-size:14px; }
.sun { background:#fff1f2 !important; }
.sat { background:#eff6ff !important; }
.day-off { color:var(--text); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
.stat-card { background:var(--card); border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); text-align:center; }
.stat-card .number { font-size:28px; font-weight:700; color:var(--primary); }
.stat-card .label { font-size:12px; color:var(--text-sub); margin-top:4px; }
.loading { text-align:center; padding:60px; color:var(--text-sub); }
.spinner { display:inline-block; width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:12px; }
@keyframes spin { to{transform:rotate(360deg);} }
.sub-tabs { display:flex; gap:4px; margin-bottom:12px; }
.sub-tabs button { padding:6px 14px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; font-size:12px; }
.sub-tabs button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.highlight { background:#fef08a; padding:0 2px; border-radius:2px; }
</style>
</head>
<body>
<div class="nav">
  <h1>新聞シフト管理</h1>
  <div class="nav-links">
    <button class="active" onclick="showView('dashboard',this)">ダッシュボード</button>
    <button onclick="showView('shift',this)">月別シフト</button>
    <button onclick="showView('tenpo',this)">店舗検索</button>
    <button onclick="showView('search',this)" style="display:none">検索</button>
    <button onclick="showView('staff',this)">スタッフ一覧</button>
    <button onclick="showView('defects',this)">不具合管理</button>
    <button onclick="showView('shopmaster',this)">店舗マスタ</button>
    <button onclick="showView('invoice',this)">請求書</button>
  </div>
</div>
<div class="container">
  <div id="loading" class="loading"><div class="spinner"></div><div>データを読み込み中...</div></div>
  <div id="view-dashboard" class="hidden">
    <div class="card"><h2>📊 今月の不具合状況</h2><div id="dash-defects"></div></div>
    <div class="card"><h2>本日のコース担当</h2><div id="dash-area-tabs" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;"></div><div class="table-wrap" id="today-assignments"></div></div>
  </div>
  <div id="view-staff" class="hidden">
    <div class="card"><h2>スタッフ一覧</h2>
      <div class="filters">
        <div><label>拠点</label><select id="sf-area" onchange="renderStaff()"><option value="">すべて</option></select></div>
        <div><label>契約範囲</label><select id="sf-contract" onchange="renderStaff()"><option value="">すべて</option></select></div>
        <div><label>名前検索</label><input type="text" id="sf-name" placeholder="名前で検索..." oninput="renderStaff()"></div>
      </div>
      <div class="table-wrap" id="staff-wrap"></div>
    </div>
  </div>
  <div id="view-courses" class="hidden">
    <div class="card"><h2>コース別 曜日担当者</h2>
      <div class="sub-tabs" id="ct"><button class="active" onclick="setEd('morning',this)">朝刊</button><button onclick="setEd('evening',this)">夕刊</button></div>
      <div class="filters">
        <div><label>エリア</label><select id="cf-area" onchange="renderCourse()"><option value="">すべて</option></select></div>
        <div><label>コース検索</label><input type="text" id="cf-name" placeholder="コースで検索..." oninput="renderCourse()"></div>
      </div>
      <div class="table-wrap" id="course-wrap"></div>
    </div>
  </div>
  <div id="view-shift" class="hidden">
    <div class="card"><h2>月別シフト表</h2>
      <div class="sub-tabs" id="sh-mode-tabs" style="margin-bottom:8px">
        <button class="active" onclick="setShMode('staff',this)">スタッフ起点</button>
        <button onclick="setShMode('course',this)">コース起点</button>
      </div>
      <div class="sub-tabs" id="sh-ed-tabs">
        <button class="active" onclick="setShEd('both',this)">朝刊・夕刊</button>
        <button onclick="setShEd('am',this)">朝刊のみ</button>
        <button onclick="setShEd('pm',this)">夕刊のみ</button>
      </div>
      <div class="filters">
        <div><label>月</label><select id="sh-month" onchange="renderShift()"></select></div>
        <div><label>営業所</label><select id="sh-area" onchange="renderShift()"><option value="">すべて</option></select></div>
        <div><label>コース検索</label><input type="text" id="sh-course" placeholder="コースで絞り込み..." oninput="renderShift()"></div>
        <div><label>スタッフ検索</label><input type="text" id="sh-staff" placeholder="スタッフで絞り込み..." oninput="renderShift()"></div>
      </div>
      <div class="table-wrap" id="shift-wrap"></div>
    </div>
  </div>
  <div id="view-tenpo" class="hidden">
    <div class="card"><h2>店舗検索</h2>
      <div class="filters">
        <div><label>日付</label><input type="date" id="tp-date" onchange="renderTenpo()"></div>
        <div><label>店舗名</label><input type="text" id="tp-name" placeholder="店舗名で検索..." oninput="renderTenpo()"></div>
        <div><label>営業所</label><select id="tp-area" onchange="renderTenpo()"><option value="">すべて</option></select></div>
        <div><label>コース</label><input type="text" id="tp-course" placeholder="コース名で検索..." oninput="renderTenpo()"></div>
      </div>
      <div style="margin-bottom:8px;color:var(--text-sub);font-size:12px" id="tp-count"></div>
      <div class="table-wrap" id="tenpo-wrap"></div>
    </div>
  </div>
  <div id="view-search" class="hidden">
    <div class="card"><h2>横断検索</h2>
      <div class="filters"><div><label>キーワード</label><input type="text" id="gs" placeholder="スタッフ名・コース名で検索..." oninput="gSearch()" style="width:300px;"></div></div>
      <div id="sr"><p style="color:var(--text-sub)">2文字以上入力してください</p></div>
    </div>
  </div>

  <!-- 不具合管理 -->
  <div id="view-defects" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin-bottom:0">不具合管理</h2>
        <button onclick="defectShowAdd()" style="background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">＋ 新規登録</button>
      </div>
      <div class="filters">
        <div><label>月</label><select id="df-month" onchange="defectLoad()"></select></div>
        <div><label>営業所</label><select id="df-area" onchange="defectFilter()"><option value="">すべて</option><option>城北</option><option>川越</option><option>立川</option><option>川崎高津</option></select></div>
        <div><label>不具合項目</label><select id="df-category" onchange="defectFilter()"><option value="">すべて</option></select></div>
        <div><label>検索</label><input type="text" id="df-search" placeholder="店舗名・ドライバー..." oninput="defectFilter()"></div>
      </div>
      <div id="df-count" style="font-size:12px;color:var(--text-sub);margin-bottom:8px;"></div>
      <div class="table-wrap" id="df-table"></div>
    </div>

    <!-- 登録/編集モーダル -->
    <div id="df-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:200;justify-content:center;align-items:center;padding:20px;">
      <div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative;">
        <button onclick="document.getElementById('df-modal').style.display='none'" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;">✕</button>
        <h3 id="df-modal-title" style="color:var(--primary);margin-bottom:16px;">不具合を登録</h3>
        <input type="hidden" id="dfe-row">
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">日付け *</label><input type="date" id="dfe-date" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">入電時間</label><input type="time" id="dfe-time" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">営業所 *</label><select id="dfe-area" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"><option value="">選択</option><option>城北</option><option>川越</option><option>立川</option><option>川崎高津</option></select></div>
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">朝刊 / 夕刊 *</label><div style="display:flex;gap:8px;"><button type="button" id="dfe-ed-am" onclick="defectSetEdition('am')" style="flex:1;padding:10px;border:2px solid var(--primary);border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;background:var(--primary);color:#fff;">🌅 朝刊</button><button type="button" id="dfe-ed-pm" onclick="defectSetEdition('pm')" style="flex:1;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;background:#fff;color:var(--text-sub);">🌙 夕刊</button></div></div>
        <div style="margin-bottom:10px;position:relative;"><label style="font-size:12px;color:var(--text-sub)">店舗名</label><input type="text" id="dfe-shop" placeholder="LA杉並区役所前" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;" oninput="defectShopSuggest()" onfocus="defectShopSuggest()" autocomplete="off"><div id="dfe-shop-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.15);"></div></div>
        <div style="margin-bottom:10px;position:relative;"><label style="font-size:12px;color:var(--text-sub)">コース</label><input type="text" id="dfe-course" placeholder="13" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;" onchange="defectAutoFillDriver()"><div id="dfe-course-suggest" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:300;box-shadow:0 4px 12px rgba(0,0,0,.15);"></div></div>
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">担当ドライバー</label><input type="text" id="dfe-driver" placeholder="遠藤" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">不具合内容</label><input type="text" id="dfe-content" placeholder="産経▲2" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">不具合項目</label><select id="dfe-category" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"><option value="">選択</option><option>仕分けミス</option><option>仕分けミス(飛</option><option>配送遅延</option><option>誤配</option><option>返品未回収</option><option>その他</option></select></div>
        <div style="margin-bottom:16px"><label style="font-size:12px;color:var(--text-sub)">原因</label><input type="text" id="dfe-reason" placeholder="確認不足" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
        <button onclick="defectSave()" id="dfe-submit" style="width:100%;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;">登録する</button>
      </div>
    </div>
  </div>

  <!-- 店舗マスタ -->
  <div id="view-shopmaster" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin-bottom:0">店舗マスタ</h2>
        <div style="display:flex;gap:8px;">
          <button onclick="smShowClose()" style="background:var(--danger);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">🔒 閉店情報</button>
          <button onclick="smShowAdd()" style="background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">🏪 新店登録</button>
        </div>
      </div>
      <div class="filters">
        <div><label>営業所</label><select id="sm-area" onchange="smFilter()"><option value="">すべて</option></select></div>
        <div><label>検索</label><input type="text" id="sm-search" placeholder="店舗名・コード..." oninput="smFilter()" style="width:200px;"></div>
      </div>
      <div id="sm-count" style="font-size:12px;color:var(--text-sub);margin-bottom:8px;"></div>
      <div class="table-wrap" id="sm-table"></div>
    </div>

    <!-- 閉店情報モーダル -->
    <div id="sm-close-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:200;justify-content:center;align-items:center;padding:20px;">
      <div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative;">
        <button onclick="document.getElementById('sm-close-modal').style.display='none'" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;">✕</button>
        <h3 style="color:var(--danger);margin-bottom:16px;">🔒 閉店情報を追加</h3>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--text-sub)">店舗を検索</label>
          <input type="text" id="smc-search" placeholder="店舗名・コードで検索..." oninput="smCloseSearch()" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;" autocomplete="off">
          <div id="smc-results" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:0 0 8px 8px;display:none;"></div>
        </div>
        <div id="smc-selected" style="display:none;background:#f1f5f9;border-radius:10px;padding:12px;margin-bottom:12px;">
          <input type="hidden" id="smc-row">
          <div id="smc-info"></div>
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--text-sub)">最終回収日</label>
          <input type="date" id="smc-last-collect" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
        </div>
        <div style="margin-bottom:16px;">
          <label style="font-size:12px;color:var(--text-sub)">最終納品日 *</label>
          <input type="date" id="smc-last-deliver" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
        </div>
        <p style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">※最終納品日の翌月20日を過ぎると、コース名が自動でクリアされ、営業所に「納品中止」が追加されます。</p>
        <button onclick="smCloseSave()" id="smc-submit" style="width:100%;background:var(--danger);color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;">閉店情報を保存</button>
      </div>
    </div>

    <!-- 編集モーダル -->
    <div id="sm-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:200;justify-content:center;align-items:center;padding:20px;">
      <div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;position:relative;">
        <button onclick="document.getElementById('sm-modal').style.display='none'" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;">✕</button>
        <h3 id="sm-modal-title" style="color:var(--primary);margin-bottom:16px;">店舗を編集</h3>
        <div id="sm-form"></div>
        <button onclick="smSave()" id="sm-submit" style="width:100%;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:12px;">保存する</button>
      </div>
    </div>
  </div>

  <!-- 請求書 -->
  <div id="view-invoice" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin-bottom:0">📄 請求書</h2>
        <div style="display:flex;gap:8px;">
          <button onclick="invShowChangePw()" id="inv-changepw-btn" style="background:#94a3b8;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;display:none;">🔑 PW変更</button>
          <button onclick="invShowRates()" class="inv-admin-only" style="background:#6366f1;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">⚙ 単価設定</button>
          <button onclick="invShowAdd()" style="background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">＋ 稼働入力</button>
        </div>
      </div>
      <!-- タブ -->

        <div style="margin-bottom:10px;display:none;" id="inv-re-unit-wrap"><label style="font-size:12px;color:var(--text-sub)">個数単価</label><input type="number" id="inv-re-unit" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>

        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">ログインID</label><input type="text" id="inv-re-loginid" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
        <div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sub)">パスワード</label><input type="text" id="inv-re-loginpw" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
        <button onclick="invSaveRate()" style="width:100%;background:#6366f1;color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;">保存する</button>
      </div>

</div>
<script>
const DEFS={
  course_staff_table:{type:'roster'},sheet26:{type:'course'},
  shift_2026_04:{label:'4月シフト2026',type:'shift',year:2026},
  shift_2026_02:{label:'2月シフト2026',type:'shift',year:2026},
  shift_2026_01:{label:'1月シフト2026',type:'shift',year:2026},
  shift_12:{label:'12月シフト',type:'shift',year:2025},
  shift_11:{label:'11月シフト',type:'shift',year:2025},
};
const DB={staff:[],courses:[],shifts:{},shiftsByCourse:{},tenpo:[],raw:{}};

function b64utf8(b){const n=atob(b),a=new Uint8Array(n.length);for(let i=0;i<n.length;i++)a[i]=n.charCodeAt(i);return new TextDecoder('utf-8').decode(a);}

function load(k){if(CSVDATA_B64&&CSVDATA_B64[k]){DB.raw[k]=Papa.parse(b64utf8(CSVDATA_B64[k]),{skipEmptyLines:false}).data;}}

function init(){
  try{
    if(typeof CSVDATA_B64==='undefined')throw new Error('data.js が見つかりません。index.html と data.js を同じフォルダに置いてください。');
    load('course_staff_table');load('sheet26');load('tenpo_list');
    parseStaff();parseCourses();parseTenpo();
    Object.keys(DEFS).forEach(k=>{const d=DEFS[k];if((d.type==='shift'||d.type==='shift_ev')&&CSVDATA_B64[k]){load(k);d.type==='shift'?parseShift(k):parseShiftEv(k);}});
    document.getElementById('loading').classList.add('hidden');
    showView('dashboard',document.querySelector('.nav-links button'));
  }catch(e){document.getElementById('loading').innerHTML='<div style="color:red;max-width:600px;margin:0 auto"><p><b>読み込み失敗</b></p><p>'+e.message+'</p></div>';}
}

function parseStaff(){
  const R=DB.raw.course_staff_table;if(!R||R.length<3)return;
  const D=['月','火','水','木','金','土','日'];
  for(let i=2;i<R.length;i++){const r=R[i],nm=(r[2]||'').trim();if(!nm)continue;
    const s={area:(r[0]||'').trim(),contract:(r[1]||'').trim(),name:nm,phone:(r[3]||'').trim(),am:{},pm:{}};
    D.forEach((d,j)=>{s.am[d]=(r[4+j]||'').trim();s.pm[d]=(r[11+j]||'').trim();});DB.staff.push(s);}
}
function parseCourses(){
  const R=DB.raw.sheet26;if(!R||R.length<2)return;
  const D=['月','火','水','木','金','土','日'];
  for(let i=1;i<R.length;i++){const r=R[i],mc=(r[0]||'').trim();if(!mc||mc==='重複')continue;
    const am={},ec=(r[9]||'').trim(),pm={};D.forEach((d,j)=>{am[d]=(r[1+j]||'').trim();});
    if(ec)D.forEach((d,j)=>{pm[d]=(r[10+j]||'').trim();});DB.courses.push({mc,am,ec,pm});}
}
function parseTenpo(){
  const R=DB.raw.tenpo_list;if(!R||R.length<2)return;
  for(let i=1;i<R.length;i++){
    const r=R[i],name=(r[2]||'').trim();if(!name)continue;
    DB.tenpo.push({
      area:(r[0]||'').trim(),code:(r[1]||'').trim(),name,
      openDate:(r[3]||'').trim(),
      amCourse:(r[4]||'').trim(),amSpecial:(r[5]||'').trim(),
      ekiNouhin:(r[6]||'').trim(),yukanDoukon:(r[7]||'').trim(),
      kyoriZou:(r[8]||'').trim(),
      amOrder:(r[11]||'').trim(),amTime:(r[12]||'').trim(),
      pmCourse:(r[13]||'').trim(),pmSpecial:(r[14]||'').trim(),
      pmEki:(r[15]||'').trim(),pmOrder:(r[16]||'').trim(),pmTime:(r[17]||'').trim(),
      keibaCourse:(r[18]||'').trim(),
      keibaOrder:(r[22]||'').trim(),keibaTime:(r[23]||'').trim(),
      lastCollect:(r[24]||'').trim(),lastDeliver:(r[25]||'').trim(),
      note:(r[26]||'').trim(),
    });
  }
}
function isDateVal(v){return v&&/^0?\d{1,2}\/\d{1,2}$/.test(v);}
function areaOfCourse(c){
  if(!c)return'';
  if(c.startsWith('城北'))return'城北';
  if(c.startsWith('川越'))return'川越';
  if(c.startsWith('立川'))return'立川';
  if(c.startsWith('川崎'))return'川崎高津';
  return'';
}
function parseShift(key){
  const R=DB.raw[key];if(!R||R.length<10)return;
  const y=DEFS[key].year||2025;
  // Use Section 1 (rows 1-6 header, rows 7+ course-based data)
  // Row 0: dates (col2=date1, col4=date2, ...)
  // Row 5: edition (col2=朝刊, col3=夕刊, col4=朝刊, col5=夕刊, ...)
  // Row 6+: course name in col0, staff names in col2+ (am=col, pm=col+1)
  const dateRow=R[0],dowRow=R[3];
  const dates=[];
  for(let c=1;c<dateRow.length;c++){
    const v=(dateRow[c]||'').trim();
    if(isDateVal(v)){
      const parts=v.split('/').map(Number);
      const m=parts[parts.length-2],d=parts[parts.length-1];
      const dow=(dowRow[c]||'').trim().replace(/\(.*?\)/g,'');
      dates.push({col:c,d:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dow,dn:d});
    }
  }
  if(!dates.length)return;
  // Parse course rows and transpose to staff->course
  // staffMap: area -> staffName -> {dateStr: {am, pm}}
  const areaData={};
  const maxRow=Math.min(116,R.length); // rows 7-116 only (1-indexed: 7-116)
  for(let i=6;i<maxRow;i++){
    const r=R[i],courseName=(r[0]||'').trim();
    if(!courseName||courseName==='重複')continue;
    const area=areaOfCourse(courseName);
    if(!area)continue;
    dates.forEach(({col,d})=>{
      const staffAm=(r[col]||'').trim();
      const staffPm=(r[col+1]||'').trim();
      if(staffAm&&staffAm!=='0'){
        if(!areaData[area])areaData[area]={};
        if(!areaData[area][staffAm])areaData[area][staffAm]={};
        if(!areaData[area][staffAm][d])areaData[area][staffAm][d]={am:'',pm:''};
        areaData[area][staffAm][d].am=courseName;
      }
      if(staffPm&&staffPm!=='0'){
        if(!areaData[area])areaData[area]={};
        if(!areaData[area][staffPm])areaData[area][staffPm]={};
        if(!areaData[area][staffPm][d])areaData[area][staffPm][d]={am:'',pm:''};
        areaData[area][staffPm][d].pm=courseName;
      }
    });
  }
  // Read section 2 (rows 163+) for special values (ミーティング, 希望休, 引継ぎ, etc)
  const specialPattern=/ミーティング|希望休|引継|研修|有給|欠勤|出張|五反田|目黒|渋谷|休刊/;
  const areas2=['城北','川越','立川','川崎高津'];
  let curArea2='';
  for(let i=120;i<R.length-2;i++){
    const a=(R[i][0]||'').trim(),b=(R[i][1]||'').trim();
    if(areas2.some(x=>a===x)&&isDateVal(b)){curArea2=a;
      // Parse dates for this section 2 block
      const s2dates=[];
      for(let c=1;c<R[i].length;c++){const v=(R[i][c]||'').trim();if(isDateVal(v)){const parts=v.split('/').map(Number);const m=parts[parts.length-2],d=parts[parts.length-1];s2dates.push({col:c,d:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`});}}
      // Read staff rows until next section
      for(let j=i+3;j<R.length;j++){
        const r2=R[j],nm=(r2[0]||'').trim();
        if(!nm)continue;
        if(areas2.some(x=>nm===x)&&isDateVal((r2[1]||'').trim()))break;
        if(nm===''&&isDateVal((r2[1]||'').trim()))break;
        const ad=areaData[curArea2];if(!ad||!ad[nm])continue;
        s2dates.forEach(({col,d})=>{
          const vAm=(r2[col]||'').trim();
          const vPm=(r2[col+1]||'').trim();
          if(vAm&&specialPattern.test(vAm)&&ad[nm][d]){ad[nm][d].am=vAm;}
          if(vPm&&specialPattern.test(vPm)&&ad[nm][d]){ad[nm][d].pm=vPm;}
          // Also add special values for staff with no section 1 data on this date
          if(vAm&&specialPattern.test(vAm)&&!ad[nm][d]){ad[nm][d]={am:vAm,pm:''};}
          if(vPm&&specialPattern.test(vPm)){if(!ad[nm][d])ad[nm][d]={am:'',pm:vPm};else if(!ad[nm][d].pm)ad[nm][d].pm=vPm;}
        });
      }
    }
  }
  // Convert to display format per area
  Object.entries(areaData).forEach(([area,staffMap])=>{
    const entries=[];
    Object.entries(staffMap).forEach(([name,dateMap])=>{
      entries.push({course:name,a:dates.map(dt=>{
        const info=dateMap[dt.d];
        return {d:dt.d,dow:dt.dow,am:info?info.am:'',pm:info?info.pm:''};
      })});
    });
    const monthLabel=DEFS[key].label;
    if(!DB.shifts[monthLabel])DB.shifts[monthLabel]={};
    DB.shifts[monthLabel][area]={dates,entries};
  });
  // Build course-based view from section 1 (rows 7-116)
  // Each course row: col0=course, col(even)=am staff, col(odd)=pm staff
  const courseData={};
  for(let i=6;i<maxRow;i++){
    const r=R[i],courseName=(r[0]||'').trim();
    if(!courseName||courseName==='重複')continue;
    const area=areaOfCourse(courseName);
    if(!area)continue;
    if(!courseData[area])courseData[area]={};
    courseData[area][courseName]=dates.map(({col,d,dow})=>{
      const am=(r[col]||'').trim();
      const pm=(r[col+1]||'').trim();
      return {d,dow,am:am==='0'?'':am,pm:pm==='0'?'':pm};
    });
  }
  const ml=DEFS[key].label;
  Object.entries(courseData).forEach(([area,courses])=>{
    const entries=[];
    Object.entries(courses).forEach(([cname,dayData])=>{
      entries.push({course:cname,a:dayData});
    });
    if(!DB.shiftsByCourse[ml])DB.shiftsByCourse[ml]={};
    DB.shiftsByCourse[ml][area]={dates,entries};
  });
}
function parseShiftEv(key){parseShift(key);}

function showView(v,btn){
  document.querySelectorAll('[id^="view-"]').forEach(e=>e.classList.add('hidden'));
  const e=document.getElementById('view-'+v);if(e)e.classList.remove('hidden');
  document.querySelectorAll('.nav-links button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  ({dashboard:renderDash,staff:renderStaffView,courses:renderCourse,shift:renderShiftView,tenpo:renderTenpoView,defects:defectInit,shopmaster:smInit,invoice:invInit}[v]||function(){})();
}

let dashAreaFilter='';
let dashTodayData=[];

function renderDash(){
  const now=new Date();
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const dw=['日','月','火','水','木','金','土'],td=dw[now.getDay()];
  dashTodayData=[];
  Object.entries(DB.shifts).forEach(([month,areas])=>{
    Object.entries(areas).forEach(([area,sh])=>{
      const di=sh.dates.findIndex(d=>d.d===todayStr);
      if(di<0)return;

async function loadDashDefects(){
  const el=document.getElementById('dash-defects');
  if(!el)return;
  const now=new Date();
  const y=now.getFullYear()%100;
  const m=now.getMonth()+1;
  const sheetName=encodeURIComponent(`${m}月/${y}`);
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${DEFECT_SHEET_ID}/values/${sheetName}!A2:I200?key=${DEFECT_API_KEY}`;
  el.innerHTML='<p style="color:var(--text-sub);font-size:12px;">読み込み中...</p>';
  try{
    const resp=await fetch(url);
    if(!resp.ok){el.innerHTML='<p style="color:var(--text-sub);font-size:12px;">不具合データなし</p>';return;}
    const json=await resp.json();
    const rows=(json.values||[]).filter(r=>r[0]||r[3]);
    if(!rows.length){el.innerHTML='<p style="color:var(--text-sub);font-size:12px;">今月の不具合: 0件</p>';return;}
    // 営業所ごとに集計
    const counts={};
    const catCounts={};
    rows.forEach(r=>{
      const area=(r[2]||'').trim()||'不明';
      counts[area]=(counts[area]||0)+1;
      const cat=(r[7]||'').trim();
      if(cat)catCounts[cat]=(catCounts[cat]||0)+1;
    });
    const areaColors={'城北':'#1d4ed8','川越':'#166534','立川':'#92400e','川崎高津':'#9d174d'};
    let html=`<div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;"><div style="flex:1;min-width:250px;">`;
    html+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">`;
    html+=`<div style="background:#fef2f2;border-radius:10px;padding:14px 22px;text-align:center;min-width:90px;"><div style="font-size:28px;font-weight:bold;color:var(--danger);">${rows.length}</div><div style="font-size:12px;color:var(--text-sub);font-weight:600;">合計</div></div>`;
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([area,cnt])=>{
      const color=areaColors[area]||'#475569';
      html+=`<div style="background:#f1f5f9;border-radius:10px;padding:14px 22px;text-align:center;min-width:90px;border-top:3px solid ${color};"><div style="font-size:28px;font-weight:bold;color:${color};">${cnt}</div><div style="font-size:12px;color:var(--text-sub);font-weight:600;">${area}</div></div>`;
    });
    html+=`</div>`;
    if(Object.keys(catCounts).length){
      html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;">`;
      Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).forEach(([cat,cnt])=>{
        html+=`<span style="background:#fee2e2;color:#dc2626;padding:4px 12px;border-radius:12px;font-size:13px;font-weight:600;">${cat}: ${cnt}</span>`;
      });
      html+=`</div>`;
    }
    html+=`</div><div style="flex-shrink:0;"><canvas id="defect-pie" width="220" height="220"></canvas></div></div>`;
    el.innerHTML=html;
    // 描画
    const canvas=document.getElementById('defect-pie');
    if(canvas){
      const ctx=canvas.getContext('2d');
      const total=rows.length;
      const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      const colors={'城北':'#3b82f6','川越':'#22c55e','立川':'#f59e0b','川崎高津':'#ec4899'};
      const fallbackColors=['#6366f1','#14b8a6','#f97316','#a855f7','#64748b'];
      let startAngle=-Math.PI/2;
      const cx=110,cy=95,r=80;
      entries.forEach(([area,cnt],i)=>{
        const slice=cnt/total*Math.PI*2;
        const color=colors[area]||fallbackColors[i%fallbackColors.length];
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,startAngle,startAngle+slice);
        ctx.closePath();
        ctx.fillStyle=color;
        ctx.fill();
        // ラベル
        const mid=startAngle+slice/2;
        const pct=Math.round(cnt/total*100);
        const lx=cx+Math.cos(mid)*(r*0.65);
        const ly=cy+Math.sin(mid)*(r*0.65);
        if(pct>=8){
          ctx.fillStyle='#fff';
          ctx.font='bold 11px sans-serif';
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          ctx.fillText(`${area}`,lx,ly-6);
          ctx.font='10px sans-serif';
          ctx.fillText(`${pct}%`,lx,ly+6);
        }
        startAngle+=slice;
      });
      // 中央に合計
      ctx.beginPath();
      ctx.arc(cx,cy,30,0,Math.PI*2);
      ctx.fillStyle='#fff';
      ctx.fill();
      ctx.fillStyle='#1e293b';
      ctx.font='bold 18px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(total,cx,cy-4);
      ctx.fillStyle='#94a3b8';
      ctx.font='9px sans-serif';
      ctx.fillText('合計',cx,cy+10);
      // 凡例
      ctx.font='11px sans-serif';
      let ly2=195;
      entries.forEach(([area,cnt],i)=>{
        const color=colors[area]||fallbackColors[i%fallbackColors.length];
        ctx.fillStyle=color;
        ctx.fillRect(4,ly2,10,10);
        ctx.fillStyle='#1e293b';
        ctx.fillText(`${area} ${cnt}件(${Math.round(cnt/total*100)}%)`,18,ly2+9);
        ly2+=14;
      });
    }
  }catch(e){
    el.innerHTML='<p style="color:var(--text-sub);font-size:12px;">不具合データ取得エラー</p>';
  }
}

// Build course->driver lookup, separated by am/pm
function getDriverMaps(dateStr){
  const amMap={},pmMap={};
  // 1. Try shift data for exact date
  let found=false;
  Object.values(DB.shifts).forEach(areas=>{
    Object.values(areas).forEach(sh=>{
    const di=sh.dates.findIndex(d=>d.d===dateStr);
    if(di<0)return;
    found=true;
    sh.entries.forEach(e=>{
      const a=e.a[di];if(!a)return;
      if(a.am&&a.am!=='0'&&a.am!=='希望休'){
        if(!amMap[a.am])amMap[a.am]=[];
        amMap[a.am].push(e.course);
      }
      if(a.pm&&a.pm!=='0'&&a.pm!=='希望休'){
        if(!pmMap[a.pm])pmMap[a.pm]=[];
        pmMap[a.pm].push(e.course);
      }
    });
  });});
  // 2. Fallback: static roster by day of week
  if(!found){
    const d=new Date(dateStr);
    const dw=['日','月','火','水','木','金','土'],td=dw[d.getDay()];
    DB.staff.forEach(s=>{
      if(s.am[td]){if(!amMap[s.am[td]])amMap[s.am[td]]=[];amMap[s.am[td]].push(s.name);}
      if(s.pm[td]){if(!pmMap[s.pm[td]])pmMap[s.pm[td]]=[];pmMap[s.pm[td]].push(s.name);}
    });
  }
  return {amMap,pmMap};
}

  if(sr.length){const s=sr.slice(0,80);h+=`<div class="card"><h2>シフト (${s.length}/${sr.length}件)</h2><table><thead><tr><th>月</th><th>コース</th><th>担当者</th></tr></thead><tbody>`;
    s.forEach(r=>{h+=`<tr><td>${r.m}</td><td>${hl(r.c,q)}</td><td>${r.sl.map(n=>hl(n,q)).join(', ')}</td></tr>`;});h+='</tbody></table></div>';}
  if(!h)h='<p style="color:var(--text-sub)">該当なし</p>';el.innerHTML=h;
}

function ao(c){if(!c)return'';if(c.startsWith('城北'))return'城北';if(c.startsWith('川越'))return'川越';if(c.startsWith('立川'))return'立川';if(c.startsWith('川崎'))return'川崎';return'';}
function bc(a){return{'城北':'badge-johoku','川越':'badge-kawagoe','立川':'badge-tachikawa','川崎':'badge-kawasaki'}[a]||'';}
function hl(t,q){if(!t||!q||!t.includes(q))return t;return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),`<span class="highlight">${q}</span>`);}

  const isCheckCol=i=>{
    const h=smHeaders[i]||'';

    // データからTRUE/FALSEを検出
    const vals=smData.slice(0,20).map(r=>r[`col_${i}`]).filter(Boolean);
    return vals.length>0&&vals.every(v=>v==='TRUE'||v==='FALSE');
  };

  smHeaders.forEach((h,i)=>{
    if(!h)return;

          <option value="">選択</option>${smMasterAreas.map(a=>`<option${a===val?' selected':''}>${a}</option>`).join('')}
        </select></div>`;
    }else if(isCourseCol(i)){
      // コース名: 検索付きドロップダウン（入力+候補）
      html+=`<div style="margin-bottom:8px;position:relative;">
        <label style="font-size:12px;color:var(--text-sub)">${h}</label>

        <datalist id="sme-dl-${i}">${smMasterCourses.map(c=>`<option value="${c}">`).join('')}</datalist>
      </div>`;
    }else if(isCheckCol(i)){
      html+=`<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="sme-${i}" ${val==='TRUE'?'checked':''}>
        <label style="font-size:12px;color:var(--text-sub)">${h}</label></div>`;
    }else{
      html+=`<div style="margin-bottom:8px;">
        <label style="font-size:12px;color:var(--text-sub)">${h}</label>
        <input type="text" id="sme-${i}" value="${val.replace(/"/g,'&quot;')}" style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
      </div>`;
    }
  });
  return html;
}

function smEdit(rowNum){

async function smSave(){
  const btn=document.getElementById('sm-submit');
  // 新規追加時のみ重複チェック
  if(!smEditRow){
    const codeIdx=smColMap.code??2;
    const nameIdx=smColMap.name??3;
    const codeEl=document.getElementById(`sme-${codeIdx}`);
    const nameEl=document.getElementById(`sme-${nameIdx}`);
    const newCode=(codeEl?codeEl.value:'').trim();
    const newName=(nameEl?nameEl.value:'').trim();
    if(newCode){
      const dupCode=smData.find(r=>(r[`col_${codeIdx}`]||'').trim()===newCode);
      if(dupCode){alert(`店舗コード「${newCode}」は既に存在しています。`);return;}
    }
    if(newName){
      const dupName=smData.find(r=>(r[`col_${nameIdx}`]||'').trim()===newName);
      if(dupName){alert(`店舗名「${newName}」は既に存在しています。`);return;}
    }
  }
  btn.textContent='保存中...';btn.disabled=true;
  const record={};
  const checkHeaders2=['特殊納品','駅納品','同梱','距離増','納本','雑誌','翌朝'];
  const isCheck2=i=>{
    const hh=smHeaders[i]||'';
    if(checkHeaders2.some(k=>hh.includes(k)))return true;
    const vals=smData.slice(0,20).map(r=>r[`col_${i}`]).filter(Boolean);
    return vals.length>0&&vals.every(v=>v==='TRUE'||v==='FALSE');
  };
  smHeaders.forEach((h,i)=>{
    if(!h)return;
    const el=document.getElementById(`sme-${i}`);
    if(!el)return;
    if(isCheck2(i)||el.type==='checkbox'){
      record[`col_${i}`]=el.checked?'TRUE':'FALSE';
    }else{
      record[`col_${i}`]=el.value;
    }
  });
  try{
    if(smEditRow){
      await fetch(SM_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update',row_number:smEditRow,record})});
    }else{
      await fetch(SM_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',record})});
    }
    document.getElementById('sm-modal').style.display='none';
    await smLoad();
  }catch(e){alert('エラー: '+e.message);}
  btn.textContent=smEditRow?'更新する':'追加する';btn.disabled=false;
}

async function invLoadAll(){
  const [ratesRes,workRes,namesRes]=await Promise.all([invApi({action:'get_rates'}),invApi({action:'list_work'}),invApi({action:'get_staff_names'})]);
  invRates=ratesRes.rates||[];
  invWork=workRes.records||[];
  invStaffNames=namesRes.names||[];
  // スタッフモード: 自分のデータのみ
  if(!invIsAdmin&&invStaffName){
    invWork=invWork.filter(w=>w.staff===invStaffName);
  }
  // UI制御: 管理者のみの要素
  const adminEls=document.querySelectorAll('.inv-admin-only');
  adminEls.forEach(el=>{el.style.display=invIsAdmin?'':'none';});
  // ログイン中の表示
  const headerArea=document.querySelector('#view-invoice .card h2');
  if(headerArea)headerArea.innerHTML=`📄 請求書 <span style="font-size:13px;color:var(--text-sub);font-weight:normal;margin-left:8px;">${invIsAdmin?'👑 管理者':'👤 '+invStaffName}</span>`;
  // PW変更ボタン（スタッフモードのみ表示）
  const pwBtn=document.getElementById('inv-changepw-btn');
  if(pwBtn)pwBtn.style.display=(!invIsAdmin&&invStaffName)?'':'none';
  // スタッフセレクタ更新（人員名簿から取得した名前を使用）
  const names=invStaffNames.length?invStaffNames:invRates.map(r=>r.name);
  // スタッフモード: 自分の名前がリストになくても追加
  if(!invIsAdmin&&invStaffName&&!names.includes(invStaffName))names.unshift(invStaffName);
  ['inve-staff','inv-staff-filter','inv-gen-staff'].forEach(id=>{
    const sel=document.getElementById(id);if(!sel)return;
    // スタッフモードの稼働入力: 自分の名前を固定
    const defaultVal=(!invIsAdmin&&invStaffName&&id==='inve-staff')?invStaffName:'';
    const val=sel.value||defaultVal;
    sel.innerHTML=(id==='inve-staff'||id==='inv-gen-staff'?'<option value="">選択</option>':'<option value="">すべて</option>')+names.map(n=>`<option${n===val?' selected':''}>${n}</option>`).join('');
    if(!invIsAdmin&&invStaffName&&id==='inve-staff'){sel.value=invStaffName;sel.disabled=true;}
  });
  // コースdatalist
  const dl=document.getElementById('inve-course-dl');
  if(dl){const courses=[...new Set(invWork.map(w=>w.course).filter(Boolean))];dl.innerHTML=courses.map(c=>`<option value="${c}">`).join('');}
  // 月初期値
  const mi=document.getElementById('inv-month');
  if(mi&&!mi.value){const n=new Date();mi.value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;}
  // 請求書期間初期値
  const now=new Date();

  if(gt&&!gt.value){const last=new Date(now.getFullYear(),now.getMonth()+1,0);gt.value=`${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,'0')}-${String(last.getDate()).padStart(2,'0')}`;}
  invFilterWork();
}

function invNormName(n){return(n||'').replace(/[\s\u3000\u00A0]+/g,'').trim();}

function invUpdateCourseSuggest(){
  const staff=document.getElementById('inve-staff').value;
  const date=document.getElementById('inve-date').value;
  const dl=document.getElementById('inve-course-dl');
  const courseInput=document.getElementById('inve-course');
  if(!staff||!date||!dl)return;
  const normStaff=invNormName(staff);
  const amCourses=[];
  const pmCourses=[];
  const isAm=invCatSel==='朝刊'||invCatSel==='庫内朝刊';

  // シフトデータから該当日・該当スタッフのコースを検索（名前の空白を無視して比較）
  Object.values(DB.shifts).forEach(areas=>{
    Object.values(areas).forEach(sh=>{
      const di=sh.dates.findIndex(d=>d.d===date);
      if(di<0)return;
      sh.entries.forEach(e=>{
        if(invNormName(e.course)!==normStaff)return;
        const a=e.a[di];if(!a)return;
        if(a.am&&a.am!=='0'&&a.am!=='希望休')amCourses.push(a.am);
        if(a.pm&&a.pm!=='0'&&a.pm!=='希望休')pmCourses.push(a.pm);
      });
    });
  });

  // フォールバック: 曜日ベースのrosterからも取得
  if(!amCourses.length&&!pmCourses.length){
    const d=new Date(date);
    const dw=['日','月','火','水','木','金','土'];
    const td=dw[d.getDay()];
    DB.staff.forEach(s=>{
      if(invNormName(s.name)!==normStaff)return;
      if(s.am[td])amCourses.push(s.am[td]);
      if(s.pm[td])pmCourses.push(s.pm[td]);
    });
  }

  // 区分に応じたコースを選択
  const courses=isAm?amCourses:pmCourses;
  const unique=[...new Set(courses)];
  dl.innerHTML=unique.map(c=>`<option value="${c}">`).join('');

  // コースを自動入力
  if(unique.length===1){
    courseInput.value=unique[0];
  }else if(unique.length>1){
    courseInput.value=unique[0]; // 最初の候補を入力、変更は手動で
  }else{
    courseInput.value='';
  }
}

function invCalcAmount(){
  const staff=document.getElementById('inve-staff').value;
  const date=document.getElementById('inve-date').value;
  if(!staff||!date){document.getElementById('inve-price').value='';document.getElementById('inve-amount').value='';return;}
  const rate=invRates.find(r=>r.name===staff);
  if(!rate){document.getElementById('inve-price').value='未設定';document.getElementById('inve-amount').value='';return;}
  const d=new Date(date);
  const dow=d.getDay();// 0=Sun
  let price=0;
  if(invCatSel==='朝刊'){
    price=Number((dow>=1&&dow<=5)?rate.am_weekday:rate.am_weekend)||0;
  }else if(invCatSel==='夕刊/競馬'){
    price=Number((dow>=1&&dow<=4)?rate.pm_weekday:rate.pm_weekend)||0;
  }else if(invCatSel==='庫内朝刊'){
    price=Number(rate.warehouse_am)||0;
  }else if(invCatSel==='庫内夕刊'){
    price=Number(rate.warehouse_pm)||0;
  }
  // 個数制
  const isQty=rate.calc_type==='個数';
  document.getElementById('inve-qty-wrap').style.display=isQty?'block':'none';
  if(isQty){
    const unitPrice=Number(rate.unit_price)||0;
    const qty=Number(document.getElementById('inve-qty').value)||0;
    price=unitPrice;
    document.getElementById('inve-price').value=unitPrice?'¥'+unitPrice.toLocaleString():'';
    document.getElementById('inve-amount').value=qty?'¥'+(unitPrice*qty).toLocaleString():'';
  }else{
    document.getElementById('inve-price').value=price?'¥'+price.toLocaleString():'';
    document.getElementById('inve-amount').value=price?'¥'+price.toLocaleString():'';
  }
}

async function invSaveWork(){
  const date=document.getElementById('inve-date').value;
  const staff=document.getElementById('inve-staff').value;
  if(!date||!staff){alert('日付とスタッフは必須です');return;}
  const btn=document.getElementById('inve-submit');btn.textContent='保存中...';btn.disabled=true;
  const rate=invRates.find(r=>r.name===staff);
  const d=new Date(date);const dow=d.getDay();
  let price=0,amount=0;
  if(rate){
    if(invCatSel==='朝刊')price=Number((dow>=1&&dow<=5)?rate.am_weekday:rate.am_weekend)||0;
    else if(invCatSel==='夕刊/競馬')price=Number((dow>=1&&dow<=4)?rate.pm_weekday:rate.pm_weekend)||0;
    else if(invCatSel==='庫内朝刊')price=Number(rate.warehouse_am)||0;
    else if(invCatSel==='庫内夕刊')price=Number(rate.warehouse_pm)||0;
    if(rate.calc_type==='個数'){
      const unitP=Number(rate.unit_price)||0;
      const qty=Number(document.getElementById('inve-qty').value)||0;
      price=unitP;amount=unitP*qty;
    }else{amount=price;}
  }
  const record={date:date.replace(/-/g,'/'),staff,course:document.getElementById('inve-course').value,category:invCatSel,start_time:document.getElementById('inve-start').value,end_time:document.getElementById('inve-end').value,quantity:document.getElementById('inve-qty').value,unit_price:String(price),amount:String(amount)};
  const rowNum=document.getElementById('inve-row').value;
  try{
    if(rowNum)await invApi({action:'update_work',record,row_number:parseInt(rowNum)});
    else await invApi({action:'add_work',record});
    document.getElementById('inv-work-modal').style.display='none';
    await invLoadAll();
  }catch(e){alert('エラー: '+e.message);}
  btn.textContent=rowNum?'更新する':'登録する';btn.disabled=false;
}

  await invApi({action:'delete_work',row_number:rowNum});
  await invLoadAll();

function invShowRates(){

  invRates.forEach((r,i)=>{
    const bizBadge=r.biz_type==='個人'?'<span style="background:#dbeafe;color:#1d4ed8;padding:1px 6px;border-radius:8px;font-size:11px;">個人</span>':r.biz_type==='法人'?'<span style="background:#dcfce7;color:#166534;padding:1px 6px;border-radius:8px;font-size:11px;">法人</span>'+(r.company?'<br><span style="font-size:11px;color:#64748b;">'+r.company+'</span>':''):'<span style="color:#cbd5e1">-</span>';
    h+=`<tr><td><b>${r.name}</b></td><td>${bizBadge}</td><td>${r.am_weekday?'¥'+Number(r.am_weekday).toLocaleString():'-'}</td><td>${r.am_weekend?'¥'+Number(r.am_weekend).toLocaleString():'-'}</td><td>${r.pm_weekday?'¥'+Number(r.pm_weekday).toLocaleString():'-'}</td><td>${r.pm_weekend?'¥'+Number(r.pm_weekend).toLocaleString():'-'}</td><td>${r.warehouse_am?'¥'+Number(r.warehouse_am).toLocaleString():'-'}</td><td>${r.warehouse_pm?'¥'+Number(r.warehouse_pm).toLocaleString():'-'}</td><td>${r.calc_type}${r.calc_type==='個数'?' ¥'+r.unit_price:''}</td><td>${r.login_id||'<span style="color:#cbd5e1">未設定</span>'}</td><td><button onclick="invEditRate(${i+2})" style="background:none;border:none;cursor:pointer;">✏️</button></td></tr>`;
  });
  h+='</tbody></table>';
  if(!invRates.length)h='<p style="color:var(--text-sub);text-align:center;padding:20px;">単価が設定されていません</p>';
  document.getElementById('inv-rate-list').innerHTML=h;
  document.getElementById('inv-rate-modal').style.display='flex';
}

function invUpdateNameSelect(selectedName){
  const sel=document.getElementById('inv-re-name');
  sel.innerHTML='<option value="">選択</option>'+invStaffNames.map(n=>`<option${n===selectedName?' selected':''}>${n}</option>`).join('');
}

function invAddRate(){
  document.getElementById('inv-re-row').value='';
  document.getElementById('inv-re-title').textContent='単価を追加';
  ['inv-re-am-wd','inv-re-am-we','inv-re-pm-wd','inv-re-pm-we','inv-re-wh-am','inv-re-wh-pm','inv-re-unit','inv-re-loginid','inv-re-loginpw'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('inv-re-biztype').value='';
  document.getElementById('inv-re-company').value='';
  document.getElementById('inv-re-company-wrap').style.display='none';
  invUpdateNameSelect('');
  document.getElementById('inv-re-calc').value='固定';
  document.getElementById('inv-re-unit-wrap').style.display='none';
  document.getElementById('inv-rate-edit').style.display='flex';
}

function invEditRate(rowNum){
  const r=invRates[rowNum-2];if(!r)return;
  document.getElementById('inv-re-row').value=rowNum;
  document.getElementById('inv-re-title').textContent=r.name+'の単価を編集';
  invUpdateNameSelect(r.name);
  document.getElementById('inv-re-am-wd').value=r.am_weekday;
  document.getElementById('inv-re-am-we').value=r.am_weekend;
  document.getElementById('inv-re-pm-wd').value=r.pm_weekday;
  document.getElementById('inv-re-pm-we').value=r.pm_weekend;
  document.getElementById('inv-re-wh-am').value=r.warehouse_am;
  document.getElementById('inv-re-wh-pm').value=r.warehouse_pm;
  document.getElementById('inv-re-calc').value=r.calc_type||'固定';
  document.getElementById('inv-re-unit').value=r.unit_price;
  document.getElementById('inv-re-unit-wrap').style.display=r.calc_type==='個数'?'block':'none';
  document.getElementById('inv-re-loginid').value=r.login_id||'';
  document.getElementById('inv-re-loginpw').value=r.login_pw||'';
  document.getElementById('inv-re-biztype').value=r.biz_type||'';
  document.getElementById('inv-re-company').value=r.company||'';
  document.getElementById('inv-re-company-wrap').style.display=r.biz_type==='法人'?'block':'none';
  document.getElementById('inv-rate-edit').style.display='flex';
}

async function invSaveRate(){
  const name=document.getElementById('inv-re-name').value.trim();
  if(!name){alert('スタッフ名は必須です');return;}
  const rowNum=document.getElementById('inv-re-row').value;
  // 重複チェック（新規追加時、または編集で名前を変えた場合）
  const existing=invRates.find((r,i)=>{
    if(rowNum&&(i+2)===parseInt(rowNum))return false;// 自分自身はスキップ
    return r.name===name;
  });
  if(existing){alert(`「${name}」は既に登録されています。同姓同名の登録はできません。`);return;}
  const record={name,am_weekday:document.getElementById('inv-re-am-wd').value,am_weekend:document.getElementById('inv-re-am-we').value,pm_weekday:document.getElementById('inv-re-pm-wd').value,pm_weekend:document.getElementById('inv-re-pm-we').value,warehouse_am:document.getElementById('inv-re-wh-am').value,warehouse_pm:document.getElementById('inv-re-wh-pm').value,calc_type:document.getElementById('inv-re-calc').value,unit_price:document.getElementById('inv-re-unit').value,login_id:document.getElementById('inv-re-loginid').value,login_pw:document.getElementById('inv-re-loginpw').value,biz_type:document.getElementById('inv-re-biztype').value,company:document.getElementById('inv-re-company').value};
  await invApi({action:'save_rate',record,row_number:rowNum?parseInt(rowNum):undefined});
  document.getElementById('inv-rate-edit').style.display='none';
  await invLoadAll();
  invShowRates();
}

// 請求書生成
function invGenerate(){
  const staff=document.getElementById('inv-gen-staff').value;
  const from=document.getElementById('inv-gen-from').value;
  const to=document.getElementById('inv-gen-to').value;
  if(!staff||!from||!to){alert('スタッフと期間を指定してください');return;}
  const filtered=invWork.filter(w=>w.staff===staff&&w.date&&w.date.replace(/\//g,'-')>=from&&w.date.replace(/\//g,'-')<=to);
  if(!filtered.length){alert('該当する稼働データがありません');return;}
  const total=filtered.reduce((s,w)=>s+Number(w.amount||0),0);
  const fromFmt=from.replace(/-/g,'/');const toFmt=to.replace(/-/g,'/');

  let h=`<div id="inv-print-area" style="background:#fff;padding:32px;border:1px solid var(--border);border-radius:12px;margin-top:16px;max-width:800px;">`;
  h+=`<div style="text-align:center;margin-bottom:24px;"><h2 style="font-size:24px;margin-bottom:4px;border-bottom:3px double #1e293b;display:inline-block;padding-bottom:4px;">請 求 書</h2></div>`;
  h+=`<div style="display:flex;justify-content:space-between;margin-bottom:20px;">`;
  h+=`<div><p style="font-size:18px;font-weight:bold;border-bottom:1px solid #1e293b;padding-bottom:2px;">${staff} 様</p></div>`;
  h+=`<div style="text-align:right;font-size:13px;color:var(--text-sub);"><p>請求日: ${new Date().toLocaleDateString('ja-JP')}</p><p>請求期間: ${fromFmt} ～ ${toFmt}</p></div>`;
  h+=`</div>`;
  h+=`<div style="background:#f1f5f9;border-radius:8px;padding:16px;text-align:center;margin-bottom:20px;"><p style="font-size:14px;color:var(--text-sub);">ご請求金額</p><p style="font-size:28px;font-weight:bold;color:var(--primary);">¥${total.toLocaleString()}</p></div>`;
  h+=`<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:#f1f5f9;"><th style="padding:8px;border:1px solid #dde1e8;text-align:left;">日付</th><th style="padding:8px;border:1px solid #dde1e8;">コース</th><th style="padding:8px;border:1px solid #dde1e8;">区分</th><th style="padding:8px;border:1px solid #dde1e8;">個数</th><th style="padding:8px;border:1px solid #dde1e8;text-align:right;">単価</th><th style="padding:8px;border:1px solid #dde1e8;text-align:right;">金額</th></tr></thead><tbody>`;
  filtered.forEach(w=>{
    h+=`<tr><td style="padding:6px 8px;border:1px solid #dde1e8;">${w.date}</td><td style="padding:6px 8px;border:1px solid #dde1e8;text-align:center;">${w.course}</td><td style="padding:6px 8px;border:1px solid #dde1e8;text-align:center;">${w.category}</td><td style="padding:6px 8px;border:1px solid #dde1e8;text-align:center;">${w.quantity||''}</td><td style="padding:6px 8px;border:1px solid #dde1e8;text-align:right;">${w.unit_price?'¥'+Number(w.unit_price).toLocaleString():''}</td><td style="padding:6px 8px;border:1px solid #dde1e8;text-align:right;font-weight:bold;">${w.amount?'¥'+Number(w.amount).toLocaleString():''}</td></tr>`;
  });
  h+=`<tr style="background:#f1f5f9;font-weight:bold;"><td colspan="5" style="padding:8px;border:1px solid #dde1e8;text-align:right;">合計</td><td style="padding:8px;border:1px solid #dde1e8;text-align:right;font-size:16px;">¥${total.toLocaleString()}</td></tr>`;
  h+=`</tbody></table>`;
  h+=`</div>`;
  h+=`<div style="margin-top:12px;text-align:right;"><button onclick="invPrintPDF()" style="background:var(--danger);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-weight:600;">🖨 PDF印刷</button></div>`;

  document.getElementById('inv-preview').innerHTML=h;
  document.getElementById('inv-preview').style.display='block';
}

function invPrintPDF(){
  const content=document.getElementById('inv-print-area').innerHTML;
  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>請求書</title><style>body{font-family:'Meiryo',sans-serif;padding:20px;color:#1e293b;}table{width:100%;border-collapse:collapse;}th,td{padding:6px 8px;border:1px solid #ccc;}@media print{button{display:none !important;}}</style></head><body>${content}<script>setTimeout(()=>window.print(),500)<\/script></body></html>`);
  win.document.close();
}

// パスワード変更
function invShowChangePw(){
  const modal=document.createElement('div');
  modal.id='inv-pw-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:300;display:flex;justify-content:center;align-items:center;padding:20px;';
  modal.innerHTML=`<div style="background:#fff;border-radius:16px;padding:32px;width:100%;max-width:380px;">
    <h3 style="color:var(--primary);margin-bottom:20px;">🔑 パスワード変更</h3>
    <p style="font-size:13px;color:var(--text-sub);margin-bottom:16px;">${invStaffName} さんのパスワードを変更</p>
    <div style="margin-bottom:12px;"><label style="font-size:12px;color:var(--text-sub)">現在のパスワード</label><input type="password" id="inv-pw-old" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
    <div style="margin-bottom:12px;"><label style="font-size:12px;color:var(--text-sub)">新しいパスワード</label><input type="password" id="inv-pw-new" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
    <div style="margin-bottom:16px;"><label style="font-size:12px;color:var(--text-sub)">新しいパスワード（確認）</label><input type="password" id="inv-pw-confirm" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;"></div>
    <div id="inv-pw-err" style="color:var(--danger);font-size:13px;margin-bottom:12px;display:none;"></div>
    <button onclick="invDoChangePw()" id="inv-pw-submit" style="width:100%;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:10px;">変更する</button>
    <button onclick="document.getElementById('inv-pw-modal').remove()" style="width:100%;background:none;border:none;color:var(--text-sub);cursor:pointer;font-size:13px;">キャンセル</button>
  </div>`;
  document.body.appendChild(modal);
}

async function invDoChangePw(){
  const oldPw=document.getElementById('inv-pw-old').value;
  const newPw=document.getElementById('inv-pw-new').value;
  const confirmPw=document.getElementById('inv-pw-confirm').value;
  const errEl=document.getElementById('inv-pw-err');
  if(!oldPw||!newPw){errEl.textContent='全ての項目を入力してください';errEl.style.display='block';return;}
  if(newPw!==confirmPw){errEl.textContent='新しいパスワードが一致しません';errEl.style.display='block';return;}
  if(newPw.length<3){errEl.textContent='パスワードは3文字以上にしてください';errEl.style.display='block';return;}

  // 現在のパスワードを検証
  const rate=invRates.find(r=>r.name===invStaffName);
  if(!rate){errEl.textContent='単価マスタにユーザーが見つかりません';errEl.style.display='block';return;}
  if(rate.login_pw!==oldPw){errEl.textContent='現在のパスワードが正しくありません';errEl.style.display='block';return;}

  // 行番号を特定
  const rowIdx=invRates.indexOf(rate);
  const rowNum=rowIdx+2;

  const btn=document.getElementById('inv-pw-submit');
  btn.textContent='変更中...';btn.disabled=true;

  try{
    const updatedRecord={...rate,login_pw:newPw,biz_type:rate.biz_type||'',company:rate.company||''};
    await invApi({action:'save_rate',record:updatedRecord,row_number:rowNum});
    document.getElementById('inv-pw-modal').remove();
    alert('パスワードを変更しました');
    await invLoadAll();
  }catch(e){
    errEl.textContent='エラーが発生しました';errEl.style.display='block';
  }
  btn.textContent='変更する';btn.disabled=false;
}

// ── 閉店情報 ──
function smShowClose(){
  document.getElementById('smc-search').value='';
  document.getElementById('smc-results').style.display='none';
  document.getElementById('smc-selected').style.display='none';
  document.getElementById('smc-row').value='';
  document.getElementById('smc-last-collect').value='';
  document.getElementById('smc-last-deliver').value='';
  document.getElementById('sm-close-modal').style.display='flex';
}

function smCloseSearch(){
  const q=(document.getElementById('smc-search').value||'').trim().toLowerCase();
  const box=document.getElementById('smc-results');
  if(q.length<2){box.style.display='none';return;}
  const nIdx=smColMap.name??3;
  const cIdx=smColMap.code??2;
  const aIdx=smColMap.area??1;
  const matches=smData.filter(r=>{
    const name=(r[`col_${nIdx}`]||'').toLowerCase();
    const code=(r[`col_${cIdx}`]||'').toLowerCase();
    return name.includes(q)||code.includes(q);
  }).slice(0,20);
  if(!matches.length){box.innerHTML='<div style="padding:10px;color:var(--text-sub);font-size:13px;">該当なし</div>';box.style.display='block';return;}
  box.innerHTML=matches.map(r=>{
    const area=r[`col_${aIdx}`]||'';
    const code=r[`col_${cIdx}`]||'';
    const name=r[`col_${nIdx}`]||'';
    return `<div onclick="smCloseSelect(${r.row_number},'${area.replace(/'/g,"\\'")}','${code.replace(/'/g,"\\'")}','${name.replace(/'/g,"\\'")}')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:13px;display:flex;justify-content:space-between;" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='#fff'"><span><b>${name}</b> (${code})</span><span class="badge ${bc(area)}">${area}</span></div>`;
  }).join('');
  box.style.display='block';
}

function smCloseSelect(rowNum,area,code,name){
  document.getElementById('smc-row').value=rowNum;
  document.getElementById('smc-info').innerHTML=`<div style="font-size:15px;font-weight:bold;color:#1e293b;">${name}</div><div style="font-size:12px;color:var(--text-sub);">${area} / ${code} / 行${rowNum}</div>`;
  document.getElementById('smc-selected').style.display='block';
  document.getElementById('smc-results').style.display='none';
  document.getElementById('smc-search').value=name;
}

async function smCloseSave(){
  const rowNum=document.getElementById('smc-row').value;
  const lastDeliver=document.getElementById('smc-last-deliver').value;
  if(!rowNum){alert('店舗を選択してください');return;}
  if(!lastDeliver){alert('最終納品日は必須です');return;}

  const btn=document.getElementById('smc-submit');
  btn.textContent='保存中...';btn.disabled=true;

  const lastCollect=document.getElementById('smc-last-collect').value;
  // Find the column indices for 最終回収日 and 最終納品日
  let collectCol=-1,deliverCol=-1;
  smHeaders.forEach((h,i)=>{
    if((h||'').includes('最終回収日'))collectCol=i;
    if((h||'').includes('最終納品日'))deliverCol=i;
  });
  // Fallback: Z=25, AA=26
  if(collectCol<0)collectCol=25;
  if(deliverCol<0)deliverCol=26;

  const record={};
  if(lastCollect)record[`col_${collectCol}`]=lastCollect.replace(/-/g,'/');
  record[`col_${deliverCol}`]=lastDeliver.replace(/-/g,'/');

  try{
    await fetch(SM_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update',row_number:parseInt(rowNum),record})});
    document.getElementById('sm-close-modal').style.display='none';
    alert('閉店情報を保存しました。翌月20日以降にコース名が自動クリアされます。');
    await smLoad();
  }catch(e){alert('エラー: '+e.message);}
  btn.textContent='閉店情報を保存';btn.disabled=false;
}

init();
</script>
