name: key-tag poller

# 預けた鍵(スマートタグ)の位置を定期取得して Supabase(EF key-tag) に送る
# 認証情報は Actions Secrets に格納:
#   KEY_TAG_SECRETS_B64    : GoogleFindMyTools の Auth/secrets.json を base64 化した文字列
#   KEY_TAG_INGEST_SECRET  : EF の KEY_TAG_INGEST_SECRET と同じ共有秘密
# シークレット未設定の間は自動でスキップ(失敗しない)。

on:
  schedule:
    # cron は UTC。JST = UTC+9。
    #
    # 🚨 これは非公式APIで、専用Googleアカウント1つに全タグを集約している。
    #    1回の実行で全タグ(25個)分のlocate要求を出すため、回し過ぎると
    #    Google側の異常検知でアカウントごと止まる恐れがある(実際にlocateが
    #    HTTP 500を返した事例あり)。出庫の時刻だけに絞り、15分間隔に留める。
    #    現状 約28回/日 ≒ 700リクエスト/日(従来の毎時20回=500から+40%)。
    #
    # 出庫前の入庫を拾う。0:00の次が2:45だと、その間に来て出た鍵は
    # 前後どちらの回でも「圏外」に見えて記録が残らない。
    #   01:00 / 02:00 JST → UTC 16:00 / 17:00
    - cron: '0 16,17 * * *'
    # 朝刊 出庫 02:50〜04:10 JST → UTC 17:45〜19:15
    - cron: '45 17 * * *'
    - cron: '0,15,30,45 18 * * *'
    - cron: '0,15 19 * * *'
    # 夕刊/競馬(11:00〜14:30 JST)は鍵を基本的に使わないため、細かく追わない。
    # 下の見張り(JST 9,12,15時)が前後と途中を押さえる。
    #
    # それ以外は3時間おきの見張りだけ。19:00〜23:00 JST(=UTC 10-14)は止める。
    # 実行は JST 0,5,8,9,12,15,18時 → 18:00 の次は 0:00 で、間隔は最大6時間。
    - cron: '0 0,3,6,9,15,20,23 * * *'
  workflow_dispatch: {}         # 手動実行(今すぐ更新)も可

concurrency:
  group: key-tag-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # タグ数 × LOCATE_TIMEOUT を超える余裕が要る。11個×60秒=11分 + 準備2分。
    # 10分だと1個でも取りこぼした時点で必ず打ち切られていた。
    timeout-minutes: 25
    steps:
      - name: Guard (secrets configured?)
        id: guard
        env:
          SECRETS_B64: ${{ secrets.KEY_TAG_SECRETS_B64 }}
        run: |
          if [ -z "$SECRETS_B64" ]; then
            echo "KEY_TAG_SECRETS_B64 未設定のためスキップします。"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this repo (poller.py)
        if: steps.guard.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone GoogleFindMyTools (pinned)
        if: steps.guard.outputs.skip != '1'
        run: |
          git clone https://github.com/leonboe1/GoogleFindMyTools.git tool
          cd tool && git checkout d46e952

      # ※ 読めないプッシュで受信が止まる問題への対処は poller.py 側で
      #    実行時に差し替えている(ライブラリのファイル書き換えは上流の変更で
      #    当たらなくなるため)。

      - name: Setup Python
        if: steps.guard.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/requirements.txt

      - name: Install deps
        if: steps.guard.outputs.skip != '1'
        run: |
          pip install -r tool/requirements.txt
          # requirements.txt がバージョン無指定のため毎回最新が入る。
          # cryptography 50.0.0 は FCM の EC 秘密鍵を受け付けず
          # "ValueError: Invalid EC key." で受信クライアントごと停止する。
          # ローカルで正常に動いている 49 系に固定する。
          pip install 'cryptography<50'
          python -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Place poller + secrets
        if: steps.guard.outputs.skip != '1'
        env:
          SECRETS_B64: ${{ secrets.KEY_TAG_SECRETS_B64 }}
        run: |
          cp repo/tools/key-tag/poller.py tool/poller.py
          printf '%s' "$SECRETS_B64" | base64 -d > tool/Auth/secrets.json
          test -s tool/Auth/secrets.json || { echo "secrets.json が空です(base64を確認)"; exit 1; }

      # FCM認証は接続のたびに更新される。Actionsは毎回まっさらなので、
      # 前回の更新分をDBから引き継がないと "Invalid EC key." で必ず落ちる。
      # (GitHub Secretは初回のブートストラップ用。以降はDB側が正)
      - name: Restore latest FCM credentials from DB
        if: steps.guard.outputs.skip != '1'
        env:
          INGEST_URL: https://nccognptoprhwsbjnwcu.supabase.co/functions/v1/key-tag
          INGEST_SECRET: ${{ secrets.KEY_TAG_INGEST_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url, sec = os.environ['INGEST_URL'], os.environ['INGEST_SECRET']
          body = json.dumps({"action": "creds_get", "secret": sec}).encode()
          req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
          try:
              r = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
          except Exception as e:
              print("creds_get 失敗(GitHub Secretの値で続行):", e); raise SystemExit(0)
          if r.get("found") and r.get("data"):
              with open("tool/Auth/secrets.json", "w", encoding="utf-8") as f:
                  json.dump(r["data"], f, ensure_ascii=False)
              print("DBの認証情報を使用します (updated_at:", r.get("updated_at"), ")")
          else:
              print("DBに保存が無いためGitHub Secretの値で起動します(初回)")
          PY

      - name: Run poller
        if: steps.guard.outputs.skip != '1'
        working-directory: tool
        env:
          INGEST_URL: https://nccognptoprhwsbjnwcu.supabase.co/functions/v1/key-tag
          INGEST_SECRET: ${{ secrets.KEY_TAG_INGEST_SECRET }}
          LOCATE_TIMEOUT: '60'
          # KEY_TAG_IDS: '6a6a55dd-0000-29d8-91a0-883d24f433d0'  # 明示したい場合
        run: python poller.py

      # 更新された認証情報を保存し、次回に引き継ぐ(Actionsは毎回まっさらなため)。
      # 🚨 失敗した回は保存しない。取得に失敗した実行では中途半端な再登録が
      #    書かれていることがあり、それをDBに戻すと正常な値を上書きしてしまう。
      - name: Save updated FCM credentials to DB
        if: success() && steps.guard.outputs.skip != '1'
        env:
          INGEST_URL: https://nccognptoprhwsbjnwcu.supabase.co/functions/v1/key-tag
          INGEST_SECRET: ${{ secrets.KEY_TAG_INGEST_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          try:
              d = json.load(open("tool/Auth/secrets.json", encoding="utf-8"))
          except Exception as e:
              print("secrets.json を読めません:", e); raise SystemExit(0)
          if not d.get("fcm_credentials") or not d.get("aas_token"):
              print("内容が不十分なため保存しません"); raise SystemExit(0)
          url, sec = os.environ['INGEST_URL'], os.environ['INGEST_SECRET']
          body = json.dumps({"action": "creds_set", "secret": sec, "data": d}).encode()
          req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
          try:
              print("creds_set:", urllib.request.urlopen(req, timeout=30).read().decode()[:200])
          except Exception as e:
              print("creds_set 失敗:", e)
          PY
